<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digital clock</title>
    <style>
        body{
           
            background-color: black;
            color:white;
            display:flex;
            align-items: center;
            justify-content: center;
        }
        h1{
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }

         /* remove scrollbar  */
        body::-webkit-scrollbar{
            display: none;
        }
        .container{
            width: 800px;
            height:400px;
            margin:200px;
            border:4px rgb(173, 173, 226) solid;
            background-color: rgb(1, 1, 51);
            
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1>Shubham Maurya Live Clock</h1>
        <h1>TIME</h1>
        <h1  class="clock">00:00:00</h1>
    </div>









    <script src="scriptt.js"></script>
</body>
</html>
